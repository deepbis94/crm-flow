name: crmflow

services:
  app:
    build:
      context: ./api
    volumes:
      - ./api:/var/www/html
    ports:
      - "8010:8000"
    environment:
      APP_NAME: CRM Flow
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8010
      APP_KEY: base64:Y3JtZmxvdy1kZXYta2V5LTMyYnl0ZXMhISE=
      LOG_CHANNEL: stderr
      LOG_STDERR_FORMATTER: Monolog\Formatter\JsonFormatter
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: crmflow
      DB_USERNAME: crmflow
      DB_PASSWORD: secret
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PREFIX: crmflow_
      CRM_FLOW_WORKER_TOKEN: crmflow-worker-dev-token
      CRM_FLOW_PAYMENT_WEBHOOK_SECRET: crmflow-payment-whsec
      CRM_FLOW_CLAIM_LOCK_TTL_MS: "300000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./worker
    volumes:
      - ./worker:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_URL: http://app:8000
      CRM_FLOW_WORKER_TOKEN: crmflow-worker-dev-token
      LARAVEL_REDIS_PREFIX: crmflow_
      SLA_SWEEP_INTERVAL_MS: "15000"
      IDLE_RECYCLE_INTERVAL_MS: "20000"
      OUTBOX_RELAY_INTERVAL_MS: "2000"
    command: sh -c "npm install && node src/index.js"
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy

  vite:
    image: node:20-alpine
    working_dir: /var/www/html
    volumes:
      - ./api:/var/www/html
    ports:
      - "5174:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_HMR_HOST: localhost
      VITE_HMR_CLIENT_PORT: "5174"
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: crmflow
      MYSQL_USER: crmflow
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3310:3306"
    volumes:
      - crmflow_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucrmflow", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    volumes:
      - crmflow_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  crmflow_mysql_data:
  crmflow_redis_data:
